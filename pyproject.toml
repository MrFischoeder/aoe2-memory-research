[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aoe2-memory-research"
version = "0.2.0"
description = "Read-only Windows process-memory research and rule-based strategy assistant for Age of Empires II: Definitive Edition (single-player)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - all rights reserved" }
authors = [{ name = "Lukasz (MrFischoeder)" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Private :: Do Not Upload",
]
dependencies = []

[project.optional-dependencies]
ui = ["PySide6>=6.6"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "PySide6>=6.6"]
build = ["PySide6>=6.6", "pyinstaller>=6.6"]

[project.scripts]
aoe2mr = "aoe2mr.cli:main"

[project.gui-scripts]
aoe2mr-gui = "aoe2mr.desktop_ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aoe2mr = ["py.typed", "default_config.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "windows: requires real Win32 APIs (skipped on other platforms)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["aoe2mr"]
